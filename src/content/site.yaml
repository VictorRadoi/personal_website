  consent:
    label: "Analytics consent"
    title: "Can I count your visit?"
    body: "I use Google Analytics to see which pages get read and roughly where visitors come from. No ads, no selling data. Your choice either way."
    accept: "Yes, count me"
    reject: "No, thanks"
    details: "What gets collected"
    note: "you can change this later in the footer"
    statusOn: "Right now: counted"
    statusOff: "Right now: not counted"

  privacy:
    h1: "Privacy"
    blocks:
      - id: short
        h: "The short version"
        p:
          - "This site counts visits with Google Analytics, and only after you say yes. There are no ads, no ad cookies, no social trackers and no selling of anything. If you say no, or ignore the note, nothing is sent to Google at all."
          - "If you send me a project brief, it is emailed to me and not stored on the site."
      - id: who
        h: "Who runs this site"
        p:
          - "Victor-Andrei Rădoi, an independent developer. I decide why and how the numbers are used, so I am the one responsible for them. Write to me at andreiradoi14@gmail.com."
      - id: collected
        h: "What is collected if you say yes"
        p:
          - "Google Analytics 4 records how the site is used. Nothing here names you or asks for your details."
        list:
          - "the pages you open and how far you scroll on project pages"
          - "which buttons and links you use, for example email, WhatsApp or booking a call"
          - "how far you get through the Start a project questions, but never your answers or details"
          - "roughly where you are (country and city), worked out from your IP address, which Google does not keep"
          - "your device, screen size, browser and language"
          - "which site sent you here"
      - id: consent-mode
        h: "How your choice is applied (Consent Mode)"
        p:
          - "I use Google Consent Mode, and on top of it the Google Analytics script is not even loaded until you say yes. Before that, and if you say no, your browser sends nothing to Google and nothing is stored on your device for analytics."
          - "If you say yes, the script loads and sets two cookies, _ga and _ga_D6Y74947LM, which tell your visits apart over time. If you change your mind later, counting stops straight away and those two cookies are deleted."
          - "I do not use advertising features, so ad storage, ad personalisation and ad data sharing stay denied for everyone. Your choice is kept for 12 months, then the site asks again."
      - id: retention
        h: "How long it is kept"
        p:
          - "Google Analytics keeps this data for 14 months, then deletes it. I only look at totals and trends, not at individual visitors."
      - id: local
        h: "What stays in your browser"
        p:
          - "The site also keeps a few small notes on your device: your consent choice and the date you made it, whether you prefer the plain cursor, and whether you found the upside-down note. While a tab is open it remembers which animations already played and, on the Start a project page, your unsent answers. None of this is sent anywhere, and the answers only leave your browser if you press Send brief."
      - id: contact
        h: "If you contact me"
        p:
          - "If you email me, message me on WhatsApp or book a call, those services handle your message under their own rules. I use what you send only to reply and to work with you."
      - id: brief
        h: "If you send a project brief"
        p:
          - "The Start a project page turns your answers into a short brief. When you press Send brief, it goes to my inbox as an email. Nothing is saved on this website or in a database. What gets sent:"
        list:
          - "the options you picked and the brief text, as you left it"
          - "your name and email, plus your company and WhatsApp number if you add them"
          - "a napkin sketch or a photo, only if you add one"
      - id: brief-delivery
        h: "How the brief reaches me"
        p:
          - "This site runs on Cloudflare, which passes the brief on to my email inbox (Gmail). I use it only to reply and to work with you, like any other email you send me."
          - "To keep out spam, the last step of the brief uses Cloudflare Turnstile. It looks at technical signals from your browser and your IP address to tell people from bots, and Cloudflare handles that under its own privacy policy. It runs without asking for your yes, because without it the form would fill up with spam."
          - "While you fill in the brief, your answers stay in that browser tab so a reload doesn't lose them. They are cleared when the brief is sent or the tab is closed. If you choose to send it by email or WhatsApp instead, it goes through that app, under its own rules."
      - id: rights
        h: "Your rights"
        p:
          - "You can ask what I hold about you, ask me to correct or delete it, or withdraw your consent at any time, using the buttons below or by writing to andreiradoi14@gmail.com. You can also complain to the data protection authority in the EU country where you live or work."
    changeHeading: "Change your mind"
    changeBody: "You can switch analytics on or off here at any time. It takes effect straight away."
    noscript: "The buttons need JavaScript. Without it the site sets nothing and counts nothing, so there is nothing to change."
    updated: "Last updated: 8 October 2026"

