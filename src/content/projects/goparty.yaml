mainShot:
  id: gp-main
  src: ../../assets/work/goparty/03-ticket-qr.png
  alt: 'GoParty "Your tickets always in app" screen with a QR code for a DISCOTERRA event'
  kind: marketing

description:
  - "GoParty is a suite of two apps. The first is for users: they discover events and buy tickets. The second is for scanning and logistics, and it is built for the organizer's team."
  - "I designed the architecture and built both apps, from the first prototype through user testing to the current release."

csi:
  challenge: "Checking tickets at the door in real time, with a queue waiting. The organizer app verifies every code against the backend live, so I used Retrofit and Dio with request caching to cut API latency and make each check faster."
  stack: ["Flutter", "Riverpod", "Retrofit", "Dio", "Stripe", "QR scanning"]
  impact: "5.0 on the App Store from 13 ratings. 100+ installs on Google Play."

features:
  - name: "Discover events."
    body: "Users find the events around them and open any one for the details."
    shots:
      - id: gp-events
        src: ../../assets/work/goparty/01-find-events.png
        alt: 'GoParty "Find events around you" screen with a DISCOTERRA event card'
        kind: marketing
  - name: "Buy tickets."
    body: "Pick a ticket category and quantity, then pay with Stripe."
    shots:
      - id: gp-checkout
        src: ../../assets/work/goparty/02-event-checkout.png
        alt: 'GoParty event page for a DISCOTERRA night with a General Access ticket, a quantity picker and the caption "Simple buying process!"'
        kind: marketing
  - name: "Tickets live in the app."
    body: "Each ticket is a QR code with the order number and category, ready to scan."
    shots:
      - id: gp-ticket
        src: ../../assets/work/goparty/03-ticket-qr.png
        alt: 'GoParty "My tickets" screen with a QR code, order number and category for a DISCOTERRA ticket'
        kind: marketing
  - name: "Scanning and logistics."
    body: "The second app is for the organizer's team. It scans tickets at the door and checks each one against the backend in real time."
  - name: "All the stats."
    body: "Organizers get the full picture of every event: all the stats, down to where each buyer bought the ticket and how they found out about the event."

