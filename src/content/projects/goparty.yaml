# GoParty: own venture (copy.md §1, §4.2, §8.3 + decisions.md: started 2023, live).
# Screenshots: the App Store listing images at full resolution (owner-approved set). The scanning and
# logistics app has no screenshots: its block is text-only.
order: 3
kind: venture
title: "GoParty"
subtitle: "A suite of two apps: one for users to discover events and buy tickets, one for scanning and logistics."
domain: ["Events", "Ticketing"]
roleLine: "Founding engineer · built both apps from an empty repo · 2023–now"
marginNote: "founding engineer"
icon: ../../assets/work/goparty/brand/app-icon.png
next: dream-pivot

seo:
  title: "GoParty · Victor-Andrei Rădoi"
  description: "GoParty is two apps: one to discover events and buy tickets, one for organizers to scan tickets and handle logistics. I'm the founding engineer and built both."
  og: /og/goparty.png

