mainShot:
  id: tb-main
  src: ../../assets/work/teamboard/01-iphone-login-digitize-track-perform.png
  alt: 'Teamboard login screen on an angled phone, under the words "Digitize, track, perform"'
  kind: marketing

description:
  - "Teamboard is one app for running a sports club, private or public: payments, the training calendar, attendance and statistics live in one place instead of WhatsApp groups, Excel sheets and paper forms."
  - "Coaches plan trainings, matches and camps. Athletes and parents say whether they're coming at least a day ahead. Attendance, payments and monthly reports build themselves from that."
  - "Our main partner is Blueshark, a basketball club with almost 200 kids, which moved its payments, calendar and statistics into Teamboard."

csi:
  challenge: "Keeping schedules, payments and notifications in sync for a whole club in real time. I restructured the app around Clean Architecture and moved real-time updates to Bloc, so new features stopped breaking old ones."
  stack: ["Flutter", "Bloc", "Clean Architecture", "Python", "Flask"]
  impact: "Almost 200 kids at Blueshark basketball club run payments, calendar and stats through it. 500+ installs on Google Play."

features:
  - name: "Payments, calendar and stats in one place."
    body: "Blueshark, our main partner, runs almost 200 kids through Teamboard: who paid and who's behind, the training calendar, and game statistics, all in the same app."
    stat:
      value: "Almost 200"
      label: "kids at Blueshark basketball club, on payments, calendar and stats"
  - name: "The calendar is the center."
    body: "Trainings, matches and camps, one-off or recurring, per team. Around it sit notes, chat and reminders, so changes reach everyone affected."
    shots:
      - id: tb-calendar
        src: ../../assets/work/teamboard/04-iphone-calendar-core-features.png
        alt: 'Teamboard calendar for a club team in October 2025, under the caption "More than 8 core features: calendar, notes, chat, reminders"'
        kind: marketing
  - name: "Any sport, any club."
    body: "Basketball, football, athletics, boxing, chess, cycling, dance, fencing, fitness and more, for private and public clubs alike."
    shots:
      - id: tb-sports
        src: ../../assets/work/teamboard/03-iphone-sports-disciplines.png
        alt: "Teamboard club screen listing sports categories for CS Gladiatorii București"
        kind: marketing
  - name: "Easy enough for parents."
    body: "Athlete and parent accounts are generated automatically, so the club doesn't sign everyone up by hand. Logging in is one screen."
    shots:
      - id: tb-login
        src: ../../assets/work/teamboard/02-iphone-login-easy-to-use.png
        alt: 'Teamboard login screen on an angled phone, under the words "Easy to use"'
        kind: marketing

